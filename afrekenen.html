  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badkamer Renovatie - Nattekrant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header met navigatie zoals op je andere pagina's -->
  <header class="site-header">
    <div class="header-container">
      <h1 class="site-title">Nattekrant</h1>
      <nav class="site-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/producten" class="nav-link">Producten</a>
        <a href="contact" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hoofd content -->
  <main class="page-container">
    <h1>Badkamer Renovatie</h1>
    <p>Testproduct: Complete badkamer renovatie. Betaal slechts €1 in testmodus om de Stripe integratie te proberen.</p>
    <button id="checkout" class="button">Koop nu (€1)</button>
  </main>

  <!-- Footer zoals andere pagina's -->
  <footer class="site-footer">
    <p>&copy; 2026 Nattekrant. Alle rechten voorbehouden.</p>
    <nav>
      <a href="/" class="footer-link">Home</a>
      <a href="/producten" class="footer-link">Producten</a>
      <a href="/contact" class="footer-link">Contact</a>
    </nav>
  </footer>

  <!-- Stripe script -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe("pk_test_51TAAAiLc89Q6vw6mgXV41WuF5JeUehoFV4oVqArFNzEnVFoac6vUZalvzPADh7961m6YsgNxCT2DoaAvhsfNQCSK00laHHBkDX");

    document.getElementById("checkout").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/create-checkout-session", { method: "POST" });
        if (!response.ok) throw new Error("Fout bij aanmaken checkout session");
        const session = await response.json();
        const result = await stripe.redirectToCheckout({ sessionId: session.id });
        if (result.error) alert(result.error.message);
      } catch (err) {
        console.error(err);
        alert("Er is iets misgegaan bij het starten van de betaling.");
      }
    });
  </script>
</body>
</html
